<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Create Project Test</title>

    <style>

        body{

            font-family:Arial,Helvetica,sans-serif;

            background:#f5f5f5;

            padding:40px;

        }

        .container{

            max-width:650px;

            margin:auto;

            background:#fff;

            padding:25px;

            border-radius:10px;

            box-shadow:0 5px 20px rgba(0,0,0,.08);

        }

        h2{

            margin-top:0;

        }

        label{

            display:block;

            margin-top:20px;

            font-weight:bold;

        }

        input[type=text],
        textarea{

            width:100%;

            padding:12px;

            border:1px solid #ddd;

            border-radius:6px;

            box-sizing:border-box;

        }

        input[type=file]{

            margin-top:10px;

        }

        button{

            margin-top:25px;

            padding:12px 25px;

            border:none;

            background:#2563eb;

            color:white;

            border-radius:6px;

            cursor:pointer;

            font-size:15px;

        }

        button:hover{

            background:#1d4ed8;

        }

        pre{

            background:#111827;

            color:#10ff83;

            padding:20px;

            border-radius:8px;

            margin-top:30px;

            overflow:auto;

        }

    </style>

</head>

<body>

<div class="container">

    <h2>Create Project</h2>

    <label>

        API URL

    </label>

    <input
            type="text"
            id="endpoint"
            value="http://localhost/collect/organization/projects/create.php"
    >

    <label>

        Bearer Token

    </label>

    <textarea
            rows="6"
            id="token"
            placeholder="Paste JWT here"
    ></textarea>

    <label>

        Project Name

    </label>

    <input
            type="text"
            id="projectName"
            placeholder="Kano Nutrition Programme"
    >

    <label>

        Project Image (Optional)

    </label>

    <input
            type="file"
            id="projectImage"
            accept="image/*"
    >

    <button onclick="createProject()">

        Create Project

    </button>

    <pre id="response">

Waiting...

    </pre>

</div>

<script>

async function createProject(){

    const endpoint=document.getElementById("endpoint").value;

    const token=document.getElementById("token").value.trim();

    const projectName=document.getElementById("projectName").value.trim();

    const image=document.getElementById("projectImage").files[0];

    if(projectName===""){

        alert("Project name required");

        return;

    }

    const formData=new FormData();

    formData.append("pro_name",projectName);

    if(image){

        formData.append("project_image",image);

    }

    document.getElementById("response").textContent="Sending request...";

    try{

        const response=await fetch(endpoint,{

            method:"POST",

            headers:{

                "Authorization":"Bearer "+token
            },

            body:formData

        });

        const text=await response.text();

        try{

            const json=JSON.parse(text);

            document.getElementById("response").textContent=
                JSON.stringify(json,null,4);

        }catch{

            document.getElementById("response").textContent=text;

        }

    }catch(e){

        document.getElementById("response").textContent=e;

    }

}

</script>

</body>

</html>
