<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supervisor Upload Test</title>

<style>
    *{
        box-sizing:border-box;
        font-family:Arial,Helvetica,sans-serif;
    }

    body{
        background:#f5f7fb;
        margin:0;
        padding:40px;
    }

    .card{
        max-width:650px;
        margin:auto;
        background:#fff;
        padding:30px;
        border-radius:10px;
        box-shadow:0 5px 15px rgba(0,0,0,.08);
    }

    h2{
        margin-top:0;
        color:#0B5ED7;
    }

    label{
        display:block;
        margin-top:18px;
        margin-bottom:6px;
        font-weight:bold;
    }

    input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:6px;
        font-size:14px;
    }

    button{
        margin-top:25px;
        width:100%;
        background:#0B5ED7;
        color:#fff;
        border:none;
        padding:14px;
        border-radius:6px;
        cursor:pointer;
        font-size:15px;
    }

    button:hover{
        background:#0849a6;
    }

    pre{
        margin-top:20px;
        background:#111;
        color:#00ff88;
        padding:15px;
        border-radius:6px;
        overflow:auto;
        white-space:pre-wrap;
    }
</style>
</head>
<body>

<div class="card">

<h2>Supervisor API Test</h2>

<form id="uploadForm">

<label>API Token</label>
<input
    type="text"
    id="token"
    placeholder="Paste JWT Access Token"
    required
>

<label>Organisation ID</label>
<input
    type="number"
    id="org_id"
    placeholder="Enter Organisation ID"
    required
>

<label>Profile Photo</label>
<input
    type="file"
    id="profile_photo"
    accept="image/*"
    required
>

<button type="submit">
    Create Supervisor
</button>

</form>

<pre id="result">Waiting...</pre>

</div>

<script>

document
.getElementById("uploadForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const form = new FormData();

    // Prefilled data
    form.append("firstName","Janet");
    form.append("lastName","Doa");
    form.append("username","janeta");
    form.append("email","janetzd@examp.com");
    form.append("password","Password@123");

    // User supplied
    form.append(
        "org_id",
        document.getElementById("org_id").value
    );

    form.append(
        "profile_photo",
        document.getElementById("profile_photo").files[0]
    );

    const token =
        document.getElementById("token").value;

    document.getElementById("result").textContent =
        "Sending request...";

    try{

        const response = await fetch(
            "http://localhost:8000/admin/supervisors/add.php",
            {
                method:"POST",
                headers:{
                    "Authorization":"Bearer " + token,
                    "Accept":"application/json"
                },
                body:form
            }
        );

        const text = await response.text();

        try{

            document.getElementById("result").textContent =
                JSON.stringify(JSON.parse(text),null,4);

        }catch{

            document.getElementById("result").textContent =
                text;

        }

    }catch(err){

        document.getElementById("result").textContent =
            err.message;

    }

});
</script>

</body>
</html>
